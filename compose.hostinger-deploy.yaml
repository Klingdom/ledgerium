services:
  web:
    image: ghcr.io/klingdom/ledgerium:latest
    container_name: ledgerium-ai
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ledgerium-data:/app/data
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
      PORT: 3000
      DATABASE_URL: file:/app/data/ledgerium.db
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: https://ledgerium.ai

  # ── Off-host backup sidecar (docs/runbooks/DATABASE_BACKUP_RESTORE.md) ────
  # See compose.hostinger.yaml for the full rationale comment (same-image
  # sidecar running scripts/backup-cron-entrypoint.sh on an hourly cron
  # schedule; AWS/AGE credentials live only here, never on `web`; runs as
  # root — deliberate, see compose.hostinger.yaml).
  #
  # `ledgerium-backups` (/backups, THIS SERVICE ONLY — `web` does not mount
  # it) is a dedicated volume for local backup scratch space, off the data
  # volume so `docker volume rm ledgerium-data` can no longer take local-only
  # backups down with it. See compose.hostinger.yaml's `backup` service
  # comment + `volumes:` comment for what this does and does not protect
  # against (real but partial — not a substitute for off-host storage).
  backup:
    image: ghcr.io/klingdom/ledgerium:latest
    pull_policy: always
    container_name: ledgerium-backup
    restart: unless-stopped
    user: root
    command: ["/app/scripts/backup-cron-entrypoint.sh"]
    volumes:
      - ledgerium-data:/app/data
      - ledgerium-backups:/backups
    environment:
      DATABASE_FILE: /app/data/ledgerium.db
      UPLOAD_DIR: /app/data/uploads
      # See compose.hostinger.yaml — on the dedicated ledgerium-backups
      # volume, not /app/data (off the data volume) and not /tmp (so the
      # incremental evidence marker survives container recreation).
      BACKUP_TMP_DIR: /backups
      # On the DATA volume (not /backups) — `web` mounts ledgerium-data and
      # needs to read this; it does NOT mount ledgerium-backups. See
      # compose.hostinger.yaml + docs/runbooks/DATABASE_BACKUP_RESTORE.md.
      BACKUP_STATUS_FILE: /app/data/.backup-status.json
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      UPLOADS_BACKUP_S3_URI: ${UPLOADS_BACKUP_S3_URI:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BACKUP_RETAIN_LOCAL: ${BACKUP_RETAIN_LOCAL:-3}
    healthcheck:
      disable: true
volumes:
  ledgerium-data:
    driver: local
  # See compose.hostinger.yaml `volumes:` comment for the full rationale
  # (protects against ledgerium-data volume loss/corruption; does NOT
  # protect against host/disk loss — that needs off-host storage).
  ledgerium-backups:
    driver: local
