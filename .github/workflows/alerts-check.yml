name: Alerts check

# Row #256 / MR-040 §2.3 - an alert signal INDEPENDENT of the application DB.
#
# WHY: `api_error_spike` reads error reports that are written to the same
# database it monitors, so a total DB outage is invisible to it. This job
# calls GET /api/admin/alerts/check hourly. If the DB is dead, computeAlerts
# throws, the route returns 500 (route.test.ts "returns 500 when computeAlerts
# throws"), this job fails, and GitHub notifies the repo owner through its own
# channel - no dependency on the dead store.
#
# SERVER SIDE: the web container must receive CRON_SECRET (same value as this
# repo secret) via deploy.yml -> compose.hostinger.yaml. If it does not, the
# route answers 503 and this job fails with a distinct "not configured on the
# server" message (script exit 4) instead of looking like an outage (500).
#
# FAILS ON: any non-200 status, a 30s timeout, any connection/DNS/TLS failure.
# HTTP 424 (row #263, script exit 5) = a P1/P2 alert is firing and reached NO
# delivery channel (none configured, or Slack/email failing): the alert exists
# but nobody was told, so this job fails and GitHub tells the repo owner.
#
# HTTP 207 (row #266, script exit 6) = PARTIAL channel failure: every firing
# alert reached >= 1 channel but a configured channel failed (revoked Slack
# webhook, SMTP down or timing out). The job fails (GitHub has no warning state)
# so the decayed redundancy is not silent; the message says someone WAS told.
#
# Row #292: the server notifies on TRANSITION (becomes firing, then a daily
# reminder). 200 = nothing needed sending OR everything attempted was delivered;
# a still-firing alert already notified is suppressed (not a failure), so a green
# run no longer means "nothing is firing". 424/207 apply to sends attempted this
# run; a failed send is retried next hour.
#
# Row #297: a persistent alert-STATE write failure (the analytics_events insert
# that records what was paged) does NOT fail this job: the route answers 200 with
# `stateWriteFailures` in the body, which this job never prints. The job stays
# green; the signal is hourly DUPLICATE pages (the next run discards the stale
# state and re-sends). Duplicate over loss, by design.
#
# DOES NOT COVER: delivery being CONFIRMED means the channel accepted it (Slack
# 2xx, email provider success), not that a human read it. Channels are only
# exercised WHILE an alert is firing, so a broken channel is not detected on a
# quiet hour (no heartbeat/test send exists). GitHub may delay or
# drop scheduled runs under load, and disables schedules on repos with no
# activity for 60 days. Detection latency is up to ~1h plus GitHub delay.
#
# PUBLIC REPO (see ops-briefing.yml): secret from secrets.CRON_SECRET, URL from
# vars.ALERTS_CHECK_URL. Only the HTTP status code is logged; never the body.
#
# UNCONFIGURED BEHAVIOUR (decision): the job FAILS with ::error:: naming what to
# configure. Rejected: skipping via `if:` - a skipped job is grey, nobody is
# notified, and "alerts are not being checked" would look like "alerts are fine".
# Cost: hourly failure emails until the secret and variable are set; that noise
# is intended pressure, since an unconfigured check is a monitoring gap.
#
# Setup:
#   gh secret set CRON_SECRET
#   gh variable set ALERTS_CHECK_URL --body https://<host>/api/admin/alerts/check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Row #296: overlapping runs (schedule + workflow_dispatch, or a delayed hourly)
# both read alert state before either writes it -> duplicate page. Serialize them.
# cancel-in-progress is false on purpose: cancelling could kill a run mid-send
# (alert delivered, state not yet recorded -> duplicate next hour) or mid-424;
# queueing lets the later run see the earlier run's recorded state. GitHub keeps
# at most one pending run per group (newest wins), fine for an hourly poll.
concurrency:
  group: alerts-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Call alerts/check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALERTS_CHECK_URL: ${{ vars.ALERTS_CHECK_URL }}
        run: bash .github/scripts/alerts-check.sh
