name: E2E — Web App (dashboard gate)

# WHY THIS EXISTS (backlog #199)
#
# Nothing ran apps/web-app/e2e until now: e2e-extension.yml covers only the
# extension, and deploy.yml's quality gate runs typecheck + vitest. The suite
# rotted unobserved — 45 of 229 tests were failing against untouched code
# (#200), and 8 dashboard tests sat skipped since April (#195) while the plan
# gating beneath them was rewritten twice.
#
# WHY ONLY TWO SPEC FILES
#
# This gate runs the subset that is green TODAY: v2-happy-path and
# v2-plan-gating (22 tests, verified 22/22 locally at loop 12). Gating the
# whole suite would be red on arrival, and a permanently red gate is one
# everybody learns to ignore — worse than no gate, because it also hides real
# regressions. Widen the `spec` list below as #200 is triaged file by file;
# every addition must be green before it is added, never added hopefully.
#
# NO SECRETS REQUIRED
#
# playwright.config.ts's webServer supplies its own test NEXTAUTH_SECRET and
# points DATABASE_URL at a throwaway SQLite file; e2e/global-setup.ts recreates
# and seeds that database on every run. Nothing here touches production.

# Triggers (loop 30): pull_request runs this standalone, so a PR still gets the
# gate. The push-to-main trigger was REMOVED and replaced by workflow_call:
# deploy.yml now calls this workflow and blocks build-and-push on its result.
# Keeping both would run it twice per push — the duplicate-run defect fixed in
# row #210 — and gating on a separate run of the same commit is weaker than
# calling it directly.
on:
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: e2e-web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Row #430 / MR-086 section 2. The single job ran all 423 tests on one
    # worker and was cancelled at its 30-minute timeout (runs 37313045649 and
    # 40523777344, both 'cancelled', no test failure). One matrix leg per
    # Playwright project instead: each leg is its own runner, so it has its own
    # test.db, its own `next dev` on :3098 and its own timeout. The callers'
    # `needs: e2e-web-app` (deploy.yml build-and-push) waits for EVERY leg and
    # fails if any leg fails, so deploy still runs only when all three pass.
    #
    # fail-fast is off so a red leg does not cancel the others and hide a
    # second failure. retries stays 2 in CI (playwright.config.ts).
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test counts from `playwright test --project=X --list`:
          # public 183, api 14 (13 + auth-setup), authenticated 227
          # (225 + 2 setup files). Sum of unique tests = 423 = the old total.
          #
          # No per-project CI timing exists: the single job never finished, and
          # the 'github' reporter logs only failures. Evidence: 423 tests did
          # not complete in ~29.5 min of test time, so CI cost > 4.2 s/test
          # (local: 9.6 min / 150 tests = 3.8 s/test at retries=1). Allow up
          # to 1.5x that overrun (total ~45 min => ~6.4 s/test) and size each
          # leg by its share, then add 2 retries' margin and ~2 min of boot.
          #   public:        183 x 6.4 s = 19.5 min -> 30 min
          #   api:            14 x 6.4 s =  1.5 min + 2 min boot -> 15 min
          #                  (generous: cold route compiles, server boot 2 min)
          #   authenticated: 225 x 6.4 s = 24 min -> 40 min
          # Replace these with measured durations after the first real run
          # (row #430 requires recording each job's CI duration).
          - project: public
            timeout: 30
          - project: api
            timeout: 15
          - project: authenticated
            timeout: 40
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check pnpm version (row #317)
        run: node scripts/check-typecheck-coverage.mjs

      # global-setup.ts runs `prisma db push --skip-generate`, so the client
      # must already be generated — same step deploy.yml's quality gate runs.
      - name: Generate Prisma client
        run: pnpm --filter @ledgerium/web-app --fail-if-no-match exec prisma generate

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium only: every project in playwright.config.ts uses
      # devices['Desktop Chrome'].
      - name: Install Playwright Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ledgerium/web-app --fail-if-no-match exec playwright install chromium --with-deps

      - name: Run dashboard E2E gate
        # Widened at loop 18: v2-states joined after its 8 stale failures were
        # triaged to green (row #200). Per the widening rule, a spec is added in
        # the SAME commit that turns it green — never added hopefully.
        # Loop 33: the spec list is GONE — the whole suite runs. Row #200 opened
        # at 45 failures of 229 listed tests; after the loop 12/18/19/20/33
        # triages the suite is 150/150 unique tests green, verified in one local
        # invocation, so naming a subset would now EXCLUDE working coverage.
        #
        # `e2e/smoke/` is still out: those specs have their own config
        # (playwright.smoke.config.ts) and need a production build.
        #
        # If this goes flaky, fix or quarantine the offending spec — do not
        # silently narrow this back to a list. The list existed because the suite
        # was red, and it is not red any more.
        #
        # Row #430: one Playwright project per matrix leg. `api` and
        # `authenticated` pull in their auth-setup dependencies themselves.
        run: pnpm --filter @ledgerium/web-app --fail-if-no-match test:e2e --project=${{ matrix.project }}

      # Row #220 / MR-026 P-9'. Rendered PNGs of the dashboard in both themes,
      # uploaded on every run (not only failures) so any change that alters what
      # the product looks like has an artefact to point at. Loop 25 changed
      # colours used in 828 places and nobody had ever looked at a page.
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ matrix.project }}
          path: apps/web-app/test-results/visual/
          # Only the public and authenticated projects render visual evidence.
          if-no-files-found: ${{ matrix.project == 'api' && 'ignore' || 'error' }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-app-${{ matrix.project }}
          path: apps/web-app/playwright-report/
          retention-days: 7
