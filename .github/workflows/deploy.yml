name: Build and Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
      - feature/recorder-v2
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: klingdom/ledgerium

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ledgerium/web-app exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  build-and-push:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # RCA-5 fix: pass NEXT_PUBLIC_* vars as Docker build-args so Next.js
          # inlines them at build time. Sourced from GitHub Actions Variables
          # (Settings → Secrets and variables → Actions → Variables tab).
          build-args: |
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Off-host backup sidecar env: see docs/runbooks/DATABASE_BACKUP_RESTORE.md.
      # Those vars are consumed by the backup service in compose.hostinger.yaml,
      # not by web. Until BACKUP_S3_URI and the AWS credentials are set, the
      # sidecar still runs on schedule but logs LOCAL ONLY every cycle — it fails
      # loudly rather than silently, but is not yet off-host durable.
      #
      # WARNING: keep the environment-variables block below to plain KEY=VALUE
      # lines ONLY. The Hostinger action interpolates that value into a shell
      # script where '#' is NOT treated as an inert comment, so backticks,
      # ${...} and parentheses in prose there are evaluated and break the deploy.
      # That is what failed run 32054072270 (2026-08-17) with:
      #   syntax error near unexpected token '('
      # Put explanatory prose HERE, as a YAML comment outside the block scalar.
      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: ledgerium
          docker-compose-path: compose.hostinger.yaml
          environment-variables: |
            NODE_ENV=production
            PORT=3000
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL || 'https://ledgerium.ai' }}
            DATABASE_URL=file:/app/data/ledgerium.db
            # Transactional email (password reset, team invites).
            # Option A — Hostinger SMTP (active once SMTP_PASSWORD secret is set).
            # Host/port/user default to the ledgerium.ai Hostinger mailbox, so the
            # ONLY required secret is SMTP_PASSWORD (the hello@ledgerium.ai mailbox
            # password). SMTP takes precedence over Resend in @/lib/email.ts.
            SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.hostinger.com' }}
            SMTP_PORT=${{ vars.SMTP_PORT || '465' }}
            SMTP_SECURE=${{ vars.SMTP_SECURE || 'true' }}
            SMTP_USER=${{ vars.SMTP_USER || 'hello@ledgerium.ai' }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            # Optional dedicated-provider alternative — left wired for future use.
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_FROM=${{ vars.EMAIL_FROM || 'Ledgerium AI <hello@ledgerium.ai>' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ledgerium.ai' }}
            DATA_DIR=/app/data
            UPLOAD_DIR=/app/data/uploads
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_STARTER_MONTHLY_PRICE_ID=${{ secrets.STRIPE_STARTER_MONTHLY_PRICE_ID }}
            STRIPE_STARTER_ANNUAL_PRICE_ID=${{ secrets.STRIPE_STARTER_ANNUAL_PRICE_ID }}
            STRIPE_SOLO_MONTHLY_PRICE_ID=${{ secrets.STRIPE_SOLO_MONTHLY_PRICE_ID }}
            STRIPE_SOLO_ANNUAL_PRICE_ID=${{ secrets.STRIPE_SOLO_ANNUAL_PRICE_ID }}
            STRIPE_TEAM_MONTHLY_PRICE_ID=${{ secrets.STRIPE_TEAM_MONTHLY_PRICE_ID }}
            STRIPE_TEAM_ANNUAL_PRICE_ID=${{ secrets.STRIPE_TEAM_ANNUAL_PRICE_ID }}
            STRIPE_GROWTH_MONTHLY_PRICE_ID=${{ secrets.STRIPE_GROWTH_MONTHLY_PRICE_ID }}
            STRIPE_GROWTH_ANNUAL_PRICE_ID=${{ secrets.STRIPE_GROWTH_ANNUAL_PRICE_ID }}
            STRIPE_PRO_PRICE_ID=${{ secrets.STRIPE_PRO_PRICE_ID }}
            STRIPE_TRIAL_DAYS=${{ vars.STRIPE_TRIAL_DAYS || '14' }}
            STRIPE_ALLOW_PROMOTION_CODES=${{ vars.STRIPE_ALLOW_PROMOTION_CODES || 'true' }}
            STRIPE_AUTOMATIC_TAX_ENABLED=${{ vars.STRIPE_AUTOMATIC_TAX_ENABLED || 'false' }}
            STRIPE_ONE_TIME_EXAMPLE_PRICE_ID=${{ secrets.STRIPE_ONE_TIME_EXAMPLE_PRICE_ID }}
            DISABLE_ADMIN_BOOTSTRAP=${{ vars.DISABLE_ADMIN_BOOTSTRAP || 'true' }}
            NEXTAUTH_SESSION_MAXAGE=${{ vars.NEXTAUTH_SESSION_MAXAGE || '86400' }}
            DEMO_MODE_DISABLE_TEAMS=${{ vars.DEMO_MODE_DISABLE_TEAMS || 'true' }}
            UMAMI_APP_SECRET=${{ secrets.UMAMI_APP_SECRET }}
            UMAMI_DB_PASSWORD=${{ secrets.UMAMI_DB_PASSWORD }}
            BACKUP_S3_URI=${{ vars.BACKUP_S3_URI }}
            UPLOADS_BACKUP_S3_URI=${{ vars.UPLOADS_BACKUP_S3_URI }}
            BACKUP_S3_ENDPOINT=${{ vars.BACKUP_S3_ENDPOINT }}
            AGE_RECIPIENT=${{ vars.AGE_RECIPIENT }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            BACKUP_RETAIN_LOCAL=${{ vars.BACKUP_RETAIN_LOCAL || '3' }}
