# ─── Ledgerium AI — Hostinger Docker Manager Compose ─────────────────────────
#
# This compose file uses a pre-built image from GitHub Container Registry.
# Used by the GitHub Actions deploy workflow and Hostinger's "Compose from URL".
#
# For local Docker builds, use compose.yaml instead.
# ──────────────────────────────────────────────────────────────────────────────

services:
  web:
    image: ghcr.io/klingdom/ledgerium:latest
    # CRITICAL: always pull the freshly-pushed :latest on every deploy. Without
    # this, `docker compose up -d` reuses the cached local image and the VPS keeps
    # running stale code — "successful" deploys that never actually update the app.
    pull_policy: always
    container_name: ledgerium-ai
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ledgerium-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/ledgerium.db
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://ledgerium.ai}
      # ── Stripe billing (iter 066-068; env vars set by GitHub Actions → host shell)
      # If unset on the host (no GitHub Secret configured), defaults to empty
      # string; the checkout/webhook routes handle empty gracefully (HTTP 503 /
      # HTTP 500 with BUG-04 retry semantics) instead of throwing at startup.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_STARTER_MONTHLY_PRICE_ID=${STRIPE_STARTER_MONTHLY_PRICE_ID:-}
      - STRIPE_STARTER_ANNUAL_PRICE_ID=${STRIPE_STARTER_ANNUAL_PRICE_ID:-}
      - STRIPE_TEAM_MONTHLY_PRICE_ID=${STRIPE_TEAM_MONTHLY_PRICE_ID:-}
      - STRIPE_TEAM_ANNUAL_PRICE_ID=${STRIPE_TEAM_ANNUAL_PRICE_ID:-}
      - STRIPE_GROWTH_MONTHLY_PRICE_ID=${STRIPE_GROWTH_MONTHLY_PRICE_ID:-}
      - STRIPE_GROWTH_ANNUAL_PRICE_ID=${STRIPE_GROWTH_ANNUAL_PRICE_ID:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - STRIPE_TRIAL_DAYS=${STRIPE_TRIAL_DAYS:-14}
      # ── Transactional email (password reset, team invites) ──────────────────
      # Host env set by the GitHub Actions deploy → interpolated here. Setting the
      # SMTP_PASSWORD secret (hello@ledgerium.ai mailbox) activates Hostinger SMTP.
      # These MUST be enumerated here or the deploy env never reaches the container.
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-hello@ledgerium.ai}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - "EMAIL_FROM=${EMAIL_FROM:-Ledgerium AI <hello@ledgerium.ai>}"
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://ledgerium.ai}
    networks:
      - proxy-net

  # ── Off-host backup sidecar (docs/runbooks/DATABASE_BACKUP_RESTORE.md) ────
  # Same image as `web`; overrides the command to run
  # scripts/backup-cron-entrypoint.sh, which schedules scripts/db-backup.sh
  # (this in turn always runs scripts/evidence-backup.sh first — see that
  # script's header for why) hourly via cron, plus a monthly evidence
  # full-rebaseline. This is a compose service — not a host crontab entry —
  # specifically because a step depending on manual host configuration is
  # what left backups undeployed before this change; see the runbook's
  # "Why the old posture was unsafe".
  #
  # AWS/AGE credentials are set ONLY on this service, never on `web` — `web`
  # never needs off-host storage or decryption access.
  #
  # Deliberately NOT on `proxy-net`: this service makes outbound-only calls
  # to the S3-compatible endpoint and never needs to be reached by, or reach,
  # the reverse proxy / umami / umami-db. It gets Compose's implicit default
  # project network for normal internet egress instead, so it never shares a
  # network with the reverse-proxy-facing services unless that's added later
  # on purpose.
  #
  # Runs as root, overriding the image's default `nextjs` user: this is a
  # deliberate, flagged trade-off — busybox crond's ownership/setuid model
  # for its default spool dir is unambiguous as root, and a manual restore
  # (`docker exec ledgerium-backup sh scripts/db-restore.sh ... CONFIRM`)
  # needs to write safety-copy files under /app/data regardless of which
  # user owns the existing files there. This container is not
  # network-exposed and only ever executes the first-party scripts baked
  # into this image at build time, so it does not carry the same blast-radius
  # concern that motivates `web` running as non-root.
  #
  # `ledgerium-backups` (mounted at /backups, THIS SERVICE ONLY — `web` does
  # not mount it) holds the scratch archives BACKUP_TMP_DIR writes before/
  # instead of off-host upload, plus evidence-backup.sh's incremental
  # marker. It used to be a subdirectory of ledgerium-data
  # (/app/data/.backup-tmp) — i.e. co-located with the data it protects,
  # which is the exact P0 this runbook exists to close (see "Why the old
  # posture was unsafe"): `docker volume rm ledgerium-data` destroyed the
  # data AND every local-only backup together. Moving BACKUP_TMP_DIR onto
  # its own volume fixes that specific failure mode WITHOUT requiring the
  # S3 credentials below to be configured — see the runbook for exactly
  # what this does and does not protect against; it is a real but partial
  # improvement, not a substitute for off-host storage.
  backup:
    image: ghcr.io/klingdom/ledgerium:latest
    pull_policy: always
    container_name: ledgerium-backup
    restart: unless-stopped
    user: root
    command: ["/app/scripts/backup-cron-entrypoint.sh"]
    volumes:
      - ledgerium-data:/app/data
      - ledgerium-backups:/backups
    environment:
      - DATABASE_FILE=/app/data/ledgerium.db
      - UPLOAD_DIR=/app/data/uploads
      # On the dedicated ledgerium-backups volume (see the service comment
      # above), not /app/data and not /tmp: off the data volume so a
      # `docker volume rm ledgerium-data` cannot take local-only scratch
      # copies down with it, and NOT /tmp so evidence-backup.sh's
      # incremental marker + locally-retained dumps still survive this
      # container being recreated on every image pull/redeploy (/tmp would
      # silently force a full evidence re-archive every deploy, defeating
      # the incremental design).
      - BACKUP_TMP_DIR=/backups
      # Read by scripts/db-backup.sh and scripts/evidence-backup.sh; written
      # onto the DATA volume (not /backups) because `web` mounts
      # ledgerium-data and needs to read it, but does NOT mount
      # ledgerium-backups — see docs/runbooks/DATABASE_BACKUP_RESTORE.md
      # "Status file (backup health tile)".
      - BACKUP_STATUS_FILE=/app/data/.backup-status.json
      - BACKUP_S3_URI=${BACKUP_S3_URI:-}
      - UPLOADS_BACKUP_S3_URI=${UPLOADS_BACKUP_S3_URI:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - AGE_RECIPIENT=${AGE_RECIPIENT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BACKUP_RETAIN_LOCAL=${BACKUP_RETAIN_LOCAL:-3}
    # The image's HEALTHCHECK probes the Next.js server, which does not run
    # in this container — disable it so `docker compose ps` doesn't show a
    # permanently "(unhealthy)" sidecar that is actually working correctly.
    healthcheck:
      disable: true

  # ── Self-hosted Umami analytics (D-1 decision: self-hosted on Hostinger VPS)
  # Umami runs as its own sidecar on port 3001 (host) → 3000 (container).
  # It uses a dedicated Postgres instance (umami-db) on the same proxy-net.
  # The NEXT_PUBLIC_UMAMI_SCRIPT_URL in the web app points to the analytics
  # subdomain served by the reverse proxy in front of this container.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    depends_on:
      - umami-db
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET}
      # TRACKER_SCRIPT_NAME keeps the default filename so the browser request
      # to /script.js resolves correctly via the reverse-proxy subdomain.
      - TRACKER_SCRIPT_NAME=script.js
    # Reverse-proxy routing:
    # The external `proxy-net` network means an existing reverse proxy manages
    # TLS + subdomain routing on this VPS. No Traefik/Caddy config was found
    # in the repository — see docs/runbooks/UMAMI_SETUP.md §4 for the three
    # possible approaches depending on which proxy Hostinger provisions.
    # If Traefik is in use, uncomment the labels block below:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.umami.rule=Host(`analytics.ledgerium.ai`)"
    #   - "traefik.http.routers.umami.tls=true"
    #   - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.umami.loadbalancer.server.port=3000"
    networks:
      - proxy-net

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    # umami-db is intentionally NOT exposed on host ports — it is only
    # reachable by the `umami` container on the shared proxy-net.
    networks:
      - proxy-net

volumes:
  ledgerium-data:
    driver: local
  # Dedicated volume for local-only backup scratch space (see the `backup`
  # service comment above). Separate from ledgerium-data for the same reason
  # umami-db-data is separate below: `docker volume rm ledgerium-data` must
  # not take this down with it. Mounted on the `backup` service ONLY — `web`
  # has no entry for it in its own `volumes:` list, so the internet-facing
  # container has no path to these archives even if compromised.
  #
  # What this volume DOES protect against: `docker volume rm
  # ledgerium-data`, application-level corruption of the data volume, or an
  # accidental `rm -rf` inside it — a copy now survives on a separate volume
  # even before any off-host (S3/R2/B2) credentials are configured.
  #
  # What this volume does NOT protect against: loss of the host itself, disk
  # failure, or anything that takes the whole VPS down — both Docker volumes
  # live on the same physical disk. That is what off-host storage
  # (BACKUP_S3_URI / UPLOADS_BACKUP_S3_URI, see the runbook's "One-time
  # setup") is for, and this volume is not a substitute for it — it is a
  # real but partial improvement, safe to ship before those credentials
  # exist, not a claim that this system has off-site backups.
  ledgerium-backups:
    driver: local
  # Dedicated volume for Umami's Postgres data. Separate from ledgerium-data
  # so `docker volume rm ledgerium-data` does not affect analytics history.
  umami-db-data:
    driver: local

networks:
  proxy-net:
    external: true
